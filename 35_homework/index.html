<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Домашнее задание: Календарь - июнь 2025</title>
		<link rel="stylesheet" href="./CSS/style.css" />
	</head>
	<body>
		<table class="calendar">
			<caption class="month">
				Июнь 2025
			</caption>
			<thead>
				<tr>
					<th class="day-on">ПН</th>
					<th class="day-on">ВТ</th>
					<th class="day-on">СР</th>
					<th class="day-on">ЧТ</th>
					<th class="day-on">ПТ</th>
					<th class="day-off">СБ</th>
					<th class="day-off">ВС</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td colspan="6"></td>
					<td class="day-off">01</td>
				</tr>
				<tr>
					<td>02</td>
					<td>03</td>
					<td>04</td>
					<td>05</td>
					<td>06</td>
					<td class="day-off">07</td>
					<td class="day-off">08</td>
				</tr>
				<tr>
					<td>09</td>
					<td>10</td>
					<td>11</td>
					<td>12</td>
					<td>13</td>
					<td class="day-off">14</td>
					<td class="day-off">15</td>
				</tr>
				<tr>
					<td>16</td>
					<td>17</td>
					<td>18</td>
					<td>19</td>
					<td>20</td>
					<td class="day-off">21</td>
					<td class="day-off">22</td>
				</tr>
				<tr>
					<td>23</td>
					<td>24</td>
					<td>25</td>
					<td>26</td>
					<td>27</td>
					<td class="day-off">28</td>
					<td class="day-off">29</td>
				</tr>
				<tr>
					<td>30</td>
					<td colspan="6"></td>
				</tr>
			</tbody>
		</table>
	</body>
</html>
